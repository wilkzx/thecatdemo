 ents.push({y:398,x:715,f:()=>{g.fillStyle='#a47148';rr(g,690,372,50,10,3);g.fill();g.fillRect(696,380,6,18);g.fillRect(728,380,6,18);emo(g,'🪮',715,376,32)}});
 if(S.owned.plant)ents.push({y:395,x:380,f:()=>emo(g,'🪴',380,396,64)});
 if(S.owned.lamp)ents.push({y:360,x:800,f:()=>{g.fillStyle='#6b4226';g.fillRect(798,300,5,60);g.fillStyle='#ffd166';g.beginPath();g.moveTo(780,300);g.lineTo(820,300);g.lineTo(810,274);g.lineTo(790,274);g.closePath();g.fill()}});
 if(S.owned.fish)ents.push({y:346,x:630,f:()=>{g.fillStyle='#8d6e63';rr(g,590,306,80,40,4);g.fill();g.fillStyle='rgba(120,200,255,.8)';rr(g,596,292,68,54,4);g.fill();emo(g,'🐠',620+Math.sin(tm*2)*12,334,22);emo(g,'🐟',645+Math.cos(tm*1.6)*10,322,16)}});
 ents.push({y:392,x:75,f:()=>{}})}

/* ================= HUD ================= */
function buildBar(){const b=$('#bar');b.innerHTML='';const add=(id,i,t,fn,badge)=>{const e=document.createElement('button');e.className='tb';e.id='tb_'+id;e.title=t;e.innerHTML=i+(badge?'<b id="bd_'+id+'"></b>':'');e.onclick=()=>{sfx('click');fn()};b.appendChild(e)};
 add('pet','✋','Głaszcz',petCat);add('hug','🤗','Przytul',hugCat);add('treat','🍬','Daj przysmak',giveTreat,1);TOYS.forEach(t=>add(t.id,t.i,t.n,()=>setToy(t.id)));
 const c=document.createElement('div');c.className='chip';c.id='chipk';b.appendChild(c);
 const n=$('#needs');n.innerHTML=NEEDS.map(([k,i,t])=>'<div class="nr" title="'+t+'"><span>'+i+'</span><div class="nb"><i id="nb_'+k+'"></i></div></div>').join('')}
function updateBar(){TOYS.forEach(t=>{const e=$('#tb_'+t.id);if(e)e.classList.toggle('on',toy.type===t.id)})}
function updateHud(){$('#nm').textContent='😺 '+S.name;$('#lv').textContent='Poziom '+S.lvl;$('#xp').style.width=(S.lvl>=100?100:S.xp/needXP(S.lvl)*100)+'%';
 $('#co').textContent='🪙 '+S.coins;const hh=Math.floor(S.time),mm=Math.floor((S.time%1)*60);const wi={clear:'☀️',cloudy:'⛅',rain:'🌧️'}[S.weather];
 $('#ck').textContent=wi+' '+String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');$('#dy').textContent=phase()+' · dzień '+S.day;
 NEEDS.forEach(([k])=>{const v=S.needs[k],e=$('#nb_'+k),bad=k==='toilet'?100-v:v;e.style.width=v+'%';e.style.background=bad>50?'#06d6a0':bad>25?'#ffb703':'#ef476f'});
 const bd=$('#bd_treat');if(bd)bd.textContent=S.inv.treat||0;$('#chipk').textContent='🍗 '+(S.inv.karma||0);
 const a=$('#act');if(nearIt){const t=nearIt.label;if(t!==ctxTxt){a.textContent=t;ctxTxt=t}a.style.display='block'}else{a.style.display='none';ctxTxt=''}
 $('#joy').style.display=(S.settings.joy&&running&&!panelOpen)?'block':'none'}

/* ================= PANELE ================= */
function showPanel(title,html,opt){panelOpen=true;$('#pt').textContent=title;$('#pb').innerHTML=html;$('#pback').style.visibility=(opt&&opt.back===false)?'hidden':'visible';$('#ov').classList.add('on');$('#pb').scrollTop=0}
function closePanel(){panelOpen=false;$('#ov').classList.remove('on');updateHud()}
function pbBack(){closePanel();if(running)openPause()}
function openPause(){showPanel('⏸️ Menu',`<div class="grid">
 <button class="btn" onclick="G.openMap()">🗺️ Mapa</button><button class="btn" onclick="G.openQuests()">📜 Zadania</button>
 <button class="btn" onclick="G.openShop()">🛍️ Sklep</button><button class="btn" onclick="G.openFriends()">😺 Znajomi</button>
 <button class="btn" onclick="G.openAch()">🏆 Osiągnięcia</button><button class="btn" onclick="G.openCal()">📅 Kalendarz</button>
 <button class="btn" onclick="G.openChoose(false)">🎨 Wygląd kota</button><button class="btn" onclick="G.openSettings()">⚙️ Ustawienia</button>
 <button class="btn" onclick="G.saveNow()">💾 Zapisz grę</button><button class="btn" onclick="G.toMain()">🏠 Menu główne</button></div>
 <button class="btn big" onclick="G.closeP()">▶ Wróć do gry</button>`,{back:false})}
function openDialog(title,text,opts){curOpts=opts||[];showPanel(title,'<p class="dlg">'+text+'</p><div class="col">'+curOpts.map((o,i)=>'<button class="btn" onclick="G.dopt('+i+')">'+o.l+'</button>').join('')+'<button class="btn" style="background:#fff" onclick="G.closeP()">Zamknij</button></div>',{back:false})}
function openMap(){showPanel('🗺️ Mapa','<p class="small">Wybierz miejsce, aby się tam przenieść (odblokowujesz je poziomami).</p>'+LOCS.map(l=>{const ok=S.lvl>=l.lvl;return'<div class="it"><div class="ic">'+l.i+'</div><div class="tx"><b>'+l.n+'</b><div class="small">'+(ok?'Dostępne':'🔒 Poziom '+l.lvl)+'</div></div><button class="btn" '+(ok?'':'disabled')+' onclick="G.go(\''+l.id+'\')">Idź</button></div>'}).join(''))}
function openQuests(){showPanel('📜 Zadania',QUESTS.map(q=>{const p=Math.min(q.prog(),q.goal),d=S.q.done[q.id];return'<div class="it '+(d?'done':'')+'"><div class="ic">'+(d?'✅':q.icon)+'</div><div class="tx"><b>'+q.name+'</b><div class="small">'+q.desc+'</div><div class="pg"><i style="width:'+(p/q.goal*100)+'%"></i></div><div class="small">'+p+'/'+q.goal+' · nagroda: 🪙'+q.rew.c+' ⭐'+q.rew.xp+(q.rew.give?' 🍗x3':'')+'</div></div></div>'}).join(''))}
function openFriends(){showPanel('😺 Znajomi',CATNPC.map(c=>{const r=S.rel[c.id]||0,m=S.q.met[c.id];return'<div class="it"><div class="ic">'+(m?'😺':'❓')+'</div><div class="tx"><b>'+(m?c.name:'Nieznany kot')+'</b><div class="small">'+(m?relName(r):'Jeszcze nie poznany')+'</div><div class="pg"><i style="width:'+r+'%;background:#ff6fa5"></i></div></div></div>'}).join(''))}
function openAch(){const rec=[['⭐ Poziom',S.lvl],['🪙 Zarobione monety',S.stats.coinsEarned||0],['🎾 Zabawy',S.stats.plays||0],['💕 Głaski',S.stats.pets||0],['📅 Dni',S.day],['⏱️ Czas gry',Math.floor(S.playtime/60)+' min']];
 showPanel('🏆 Osiągnięcia','<h4 style="margin-top:0">Rekordy</h4>'+rec.map(r=>'<div class="row"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join('')+'<h4>Osiągnięcia ('+Object.keys(S.ach).length+'/'+ACHS.length+')</h4>'+ACHS.map(a=>{const v=Math.min(getStat(a.stat),a.goal),d=S.ach[a.id];return'<div class="it '+(d?'':'done')+'"><div class="ic">'+(d?a.icon:'🔒')+'</div><div class="tx"><b>'+a.name+'</b><div class="small">'+a.desc+'</div><div class="pg"><i style="width:'+(v/a.goal*100)+'%"></i></div></div><div class="small">'+v+'/'+a.goal+'</div></div>'}).join(''),{back:running})}
function openCal(){let h='<p><b>Dzień '+S.day+'</b> · '+phase()+' · '+{clear:'☀️ słonecznie',cloudy:'⛅ pochmurno',rain:'🌧️ deszcz'}[S.weather]+'</p>';for(let d=S.day;d<S.day+10;d++){const e=evOf(d);h+='<div class="row"><span>'+(d===S.day?'<b>Dziś</b>':'Dzień '+d)+'</span><span>'+(e.length?e.map(x=>x.i+' '+x.n+' <small>('+x.d+')</small>').join(', '):'<span class="small">—</span>')+'</span></div>'}showPanel('📅 Kalendarz wydarzeń',h)}
function openSettings(){const s=S.settings,onoff=v=>v?'Włączone':'Wyłączone';showPanel('⚙️ Ustawienia',`
 <div class="row"><span>🔊 Dźwięk</span><button class="btn" onclick="G.set('sound')">${onoff(s.sound)}</button></div>
 <div class="row"><span>Głośność</span><input type="range" min="0" max="100" value="${Math.round(s.vol*100)}" oninput="G.vol(this.value)"></div>
 <div class="row"><span>🎨 Grafika</span><button class="btn" onclick="G.set('gfx')">${s.gfx?'Wysoka':'Niska'}</button></div>
 <div class="row"><span>🕹️ Joystick ekranowy</span><button class="btn" onclick="G.set('joy')">${onoff(s.joy)}</button></div>
 <h4>Sterowanie</h4><p class="small">📱 Dotknij ekranu – kot idzie w to miejsce. Dotknij przedmiotu lub postaci – kot tam podejdzie. Dotknij kota – pogłaszczesz go. Zabawki wybierasz na dolnym pasku.<br>
 💻 Kliknij myszką tak samo, albo steruj strzałkami / WASD. E lub spacja – akcja. Esc – menu.</p>`,{back:running||true})}
function renderShop(){const disc=hasEv('market')?.8:1;let h='<div class="row"><b>🪙 '+S.coins+'</b>'+(hasEv('market')?'<span>🛍️ Targ: -20%!</span>':'')+'</div><div class="tabs">'+SHOP_CATS.map(c=>'<button class="btn '+(c===shopTab?'on':'')+'" onclick="G.tab(\''+c+'\')">'+c+'</button>').join('')+'</div>';
 ITEMS.filter(i=>i.cat===shopTab).forEach(it=>{const own=S.owned[it.id],pr=Math.round(it.price*disc);let btn;
  if(it.give)btn='<button class="btn" '+(S.lvl<it.lvl?'disabled':'')+' onclick="G.buy(\''+it.id+'\')">'+(S.lvl<it.lvl?'🔒 Poz. '+it.lvl:'🪙 '+pr)+'</button>';
  else if(own&&it.slot){const eq=S.equip[it.slot]===it.id;btn='<button class="btn" '+(it.slot==='bed'&&eq?'disabled':'')+' onclick="G.equip(\''+it.id+'\')">'+(eq?(it.slot==='bed'?'Używane':'Zdejmij'):'Użyj')+'</button>'}
  else if(own)btn='<span class="small">Posiadasz ✓</span>';else btn='<button class="btn" '+(S.lvl<it.lvl?'disabled':'')+' onclick="G.buy(\''+it.id+'\')">'+(S.lvl<it.lvl?'🔒 Poz. '+it.lvl:'🪙 '+pr)+'</button>';
  h+='<div class="it"><div class="ic">'+it.icon+'</div><div class="tx"><b>'+it.name+'</b><div class="small">'+(it.desc||'')+'</div></div>'+btn+'</div>'});
 if(shopTab==='Jedzenie')h+='<div class="small" style="margin-top:8px">W magazynie: 🍗 '+(S.inv.karma||0)+' · 🍬 '+(S.inv.treat||0)+'</div>';showPanel('🛍️ Sklep zoologiczny',h)}
function openShop(){renderShop()}
function openChoose(isNew){chooseNew=isNew;showPanel(isNew?'😺 Nowa gra – Twój kot':'😺 Wybierz kota',`
 <canvas id="pv" width="300" height="190" style="width:100%;max-width:300px;display:block;margin:0 auto;background:#e8f7d4;border-radius:14px"></canvas>
 <label>Imię kota<input type="text" id="nmi" maxlength="14" value="${esc(S.name)}" oninput="G.name(this.value)"></label>
 <h4>Rasa</h4><div class="chips" id="cb"></div><h4>Kolor</h4><div class="chips" id="cs"></div>
 <label style="display:block;margin-top:10px"><input type="checkbox" ${S.cat.stripes?'checked':''} onchange="G.stripes(this.checked)"> Pręgi</label>
 <button class="btn big" onclick="G.chosen()">${isNew?'▶ Zaczynamy!':'✔ Gotowe'}</button>`,{back:!isNew});renderChoose();startPreview()}
function renderChoose(){$('#cb').innerHTML=BREEDS.map(b=>'<button class="chp '+(S.cat.breed===b.id?'on':'')+'" onclick="G.breed(\''+b.id+'\')">'+b.name+'</button>').join('');
 $('#cs').innerHTML=SKINS.map(s=>'<button class="sw '+(S.cat.skin===s.id?'on':'')+'" title="'+s.name+(S.lvl<s.lvl?' (poz. '+s.lvl+')':'')+'" style="background:'+s.c+'" '+(S.lvl<s.lvl?'disabled':'')+' onclick="G.skin(\''+s.id+'\')"></button>').join('')}
function startPreview(){if(pvOn)return;pvOn=true;(function f(){const c=$('#pv');if(!c||!panelOpen){pvOn=false;return}const g=c.getContext('2d');g.clearRect(0,0,300,190);g.fillStyle='#bfe8a0';g.fillRect(0,140,300,50);drawCat(g,150,150,Object.assign({},S.cat,{scale:1.7,dir:1,pose:'idle',t:performance.now()/1000,acc:S.equip,blink:Math.sin(performance.now()/1500)>.98?-1:1}));requestAnimationFrame(f)})()}

/* ================= G (interfejs) ================= */
const G=window.G={
 pause(){if(!running||panelOpen)return;sfx('click');openPause()},closeP(){closePanel();if(!running)$('#main').classList.remove('off')},back(){sfx('click');if(running)pbBack();else closePanel()},
 openMap,openQuests,openFriends,openAch,openCal,openSettings,openShop,openChoose,
 ctx(){if(nearIt&&!cat.act){useIt(nearIt)}else if(cat.act&&cat.act.type==='sleep')wake()},
 dopt(i){const o=curOpts[i];closePanel();if(o&&o.f)o.f()},
 saveNow(){save();toast('💾 Gra zapisana')},
 toMain(){save();closePanel();running=false;$('#hud').classList.remove('on');$('#main').classList.remove('off');$('#mcont').disabled=!hasSave},
 mNew(){if(hasSave&&!confirm('Rozpocząć nową grę? Obecny zapis zostanie nadpisany.'))return;const st=S.settings;S=fresh();S.settings=st;openChoose(true)},
 mCont(){const d=load();if(!d)return;S=d;startGame()},mChoose(){openChoose(false)},mShop(){openShop()},
 set(k){S.settings[k]=S.settings[k]?0:1;if(k==='sound'&&S.settings.sound)audio();openSettings();try{save()}catch(e){}},vol(v){S.settings.vol=v/100;tone(600,600,.1,'sine',.3)},
 tab(c){shopTab=c;sfx('click');renderShop()},
 buy(id){const it=ITEMS.find(i=>i.id===id),pr=Math.round(it.price*(hasEv('market')?.8:1));if(S.lvl<it.lvl||S.coins<pr){toast('Brak monet lub poziomu 😿');return}S.coins-=pr;
  if(it.give)for(const k in it.give)S.inv[k]=(S.inv[k]||0)+it.give[k];else{S.owned[id]=1;if(it.slot)S.equip[it.slot]=id}stat('bought');sfx('coin');toast('Kupiono: '+it.name+' ✅');renderShop()},
 equip(id){const it=ITEMS.find(i=>i.id===id);if(S.equip[it.slot]===id){if(it.slot!=='bed')delete S.equip[it.slot]}else S.equip[it.slot]=id;sfx('click');renderShop()},
 go(id){goLoc(id)},
 name(v){S.name=v.trim().slice(0,14)||'Mruczek'},breed(id){S.cat.breed=id;sfx('meow');renderChoose()},skin(id){S.cat.skin=id;sfx('click');renderChoose()},stripes(v){S.cat.stripes=!!v},
 chosen(){if(chooseNew){closePanel();startGame()}else{closePanel();save();if(running)openPause()}}};
function startGame(){running=true;closePanel();$('#main').classList.add('off');$('#hud').classList.add('on');scene=S.scene==='world'?'world':'home';cat.x=S.x;cat.y=S.y;cat.tx=null;cat.pending=null;cat.act=null;toy.type=null;crit.length=0;parts.length=0;
 lastPhase=phase();lastZone='';camX=sceneW()>visW?clamp(cat.x-visW/2,0,sceneW()-visW):(sceneW()-visW)/2;updateBar();updateHud();audio();hasSave=true;save();
 if(S.settings.hints&&S.stats.hinted===undefined){S.stats.hinted=1;toast('👆 Dotknij ekranu, by kot poszedł. Zabawki są na dolnym pasku.',5000);setTimeout(()=>toast('🍗 Zacznij od miski z jedzeniem w domu!',4500),2500)}}

/* ================= WEJŚCIE ================= */
function toWorld(e){return{x:e.clientX/scl+camX,y:e.clientY/scl-oy}}
function onTap(x,y){if(cat.act&&cat.act.type==='sleep'){wake();return}if(cat.act)return;if(toy.type){toyTap(x,y);return}
 if(dist(x,y,cat.x,cat.y-28)<46){petCat();return}
 let best=null,bd=1e9;curI().forEach(i=>{const d=dist(x,y,i.x,i.y-(i.r>40?40:22));if(d<(i.r>40?62:52)&&d<bd){bd=d;best=i}});
 if(best){goTo(best);return}
 cat.pending=null;cat.chase=false;cat.tx=clamp(x,24,sceneW()-24);cat.ty=clamp(y,BAND0,BAND1);fx(cat.tx,cat.ty,'🐾',1)}
cv.addEventListener('pointerdown',e=>{if(!running||panelOpen)return;audio();const p=toWorld(e);ptr.x=p.x;ptr.y=p.y;ptr.down=true;onTap(p.x,p.y)});
cv.addEventListener('pointermove',e=>{const p=toWorld(e);ptr.x=p.x;ptr.y=p.y});
window.addEventListener('pointerup',()=>{ptr.down=false});
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down'};
window.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT'&&e.target.type==='text')return;const k=KM[e.code];if(k&&running&&!panelOpen){keys[k]=1;e.preventDefault()}
 if((e.code==='KeyE'||e.code==='Space'||e.code==='Enter')&&running&&!panelOpen){e.preventDefault();G.ctx()}
 if(e.code==='Escape'){if(panelOpen){if($('#pback').style.visibility!=='hidden')G.back();else G.closeP()}else if(running)openPause()}});
window.addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=0});
(function(){const j=$('#joy'),kn=j.querySelector('i');let id=null;const R=40;
 function mv(e){const r=j.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d}kn.style.transform='translate('+dx+'px,'+dy+'px)';joy.x=dx/R;joy.y=dy/R}
 function end(){id=null;joy.x=joy.y=0;kn.style.transform=''}
 j.addEventListener('pointerdown',e=>{id=e.pointerId;j.setPointerCapture(id);mv(e);e.preventDefault()});j.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e)});j.addEventListener('pointerup',end);j.addEventListener('pointercancel',end)})();
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.floor(innerWidth*dpr);cv.height=Math.floor(innerHeight*dpr);scl=Math.min(innerHeight/VH,innerWidth/400);visW=innerWidth/scl;visH=innerHeight/scl;oy=(innerHeight-70)/(2*scl)-360}
window.addEventListener('resize',resize);resize();
window.addEventListener('pagehide',()=>{if(running)save()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)save()});
document.addEventListener('contextmenu',e=>e.preventDefault());
buildBar();$('#mcont').disabled=!hasSave;
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(running&&!panelOpen){update(dt);uiT+=dt;if(uiT>.2){uiT=0;updateHud()}}
 if(running||!$('#main').classList.contains('off')===false){render()}requestAnimationFrame(loop)}
setInterval(()=>{if(running&&!panelOpen)save()},15000);
requestAnimationFrame(loop);
</script>
